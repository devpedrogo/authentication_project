spring:
  application:
    name: authentication-module
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # O Flyway gerenciará a DDL do banco (criação de tabelas), portanto o Hibernate valida apenas o esquema
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    # Pasta onde os scripts de migration V1__... devem ficar localizados
    locations: classpath:db/migration
    baseline-on-migrate: true
    
api:
  security:
    token:
      secret: ${JWT_SECRET:4zV9xK1wY8qP3bN7mR0vC2xL5jH8fG1dS4aK9zX2yW5vB8nM3pQ6rT9uV2wX5yZ8}
      expiration-ms: 900000 # 15 minutos em milissegundos
      refresh-expiration-ms: 604800000 # 7 dias em milissegundos